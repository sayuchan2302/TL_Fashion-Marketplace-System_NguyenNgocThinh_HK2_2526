spring:
  config:
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]
  application:
    name: fashion-marketplace
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        globally_quoted_identifiers: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:10MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  # 24 hours in milliseconds
  expiration: 86400000
  # 7 days in milliseconds
  refresh-expiration: 604800000

app:
  security:
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    cors-allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
  password-reset:
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    token-ttl-minutes: ${APP_PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    max-requests-per-hour: ${APP_PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    token-info-url: ${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
  upload:
    base-dir: ${APP_UPLOAD_BASE_DIR:backend/upload}
    max-avatar-size-bytes: ${APP_UPLOAD_MAX_AVATAR_SIZE_BYTES:3145728}
    max-product-image-size-bytes: ${APP_UPLOAD_MAX_PRODUCT_IMAGE_SIZE_BYTES:5242880}
    max-product-image-pixels: ${APP_UPLOAD_MAX_PRODUCT_IMAGE_PIXELS:20000000}
    max-store-image-size-bytes: ${APP_UPLOAD_MAX_STORE_IMAGE_SIZE_BYTES:5242880}
    max-category-image-size-bytes: ${APP_UPLOAD_MAX_CATEGORY_IMAGE_SIZE_BYTES:5242880}
    max-review-image-size-bytes: ${APP_UPLOAD_MAX_REVIEW_IMAGE_SIZE_BYTES:5242880}
    max-return-evidence-size-bytes: ${APP_UPLOAD_MAX_RETURN_EVIDENCE_SIZE_BYTES:5242880}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    gap:
      enabled: ${APP_SEED_GAP_ENABLED:false}
      target-count: ${APP_SEED_GAP_TARGET_COUNT:1000}
      styles-path: ${APP_SEED_GAP_STYLES_PATH:backend/src/main/resources/product/styles.csv}
      images-path: ${APP_SEED_GAP_IMAGES_PATH:backend/src/main/resources/product/images.csv}
      clean-before-import: ${APP_SEED_GAP_CLEAN_BEFORE_IMPORT:false}
      report-enabled: ${APP_SEED_GAP_REPORT_ENABLED:false}
      report-output-dir: ${APP_SEED_GAP_REPORT_OUTPUT_DIR:backend/target/gap-coverage}
  chatbot:
    ai-fallback-enabled: ${APP_CHATBOT_AI_FALLBACK_ENABLED:false}
    direct-line-secret: ${BOT_DIRECT_LINE_SECRET:}
    direct-line-token-endpoint: ${BOT_DIRECT_LINE_TOKEN_ENDPOINT:https://directline.botframework.com/v3/directline/tokens/generate}
    direct-line-conversation-endpoint: ${BOT_DIRECT_LINE_CONVERSATION_ENDPOINT:https://directline.botframework.com/v3/directline/conversations}
  vision:
    enabled: ${APP_VISION_ENABLED:true}
    base-url: ${APP_VISION_BASE_URL:http://localhost:8001}
    internal-secret: ${APP_VISION_INTERNAL_SECRET:}
    connect-timeout-ms: ${APP_VISION_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${APP_VISION_READ_TIMEOUT_MS:20000}
    max-candidates: ${APP_VISION_MAX_CANDIDATES:120}
    max-upload-size-bytes: ${APP_VISION_MAX_UPLOAD_SIZE_BYTES:5242880}
    rate-limit-enabled: ${APP_VISION_RATE_LIMIT_ENABLED:true}
    rate-limit-per-minute: ${APP_VISION_RATE_LIMIT_PER_MINUTE:6}
    rate-limit-per-hour: ${APP_VISION_RATE_LIMIT_PER_HOUR:30}
    trust-proxy-headers: ${APP_TRUST_PROXY_HEADERS:false}
  notifications:
    promotion:
      timezone: ${APP_PROMOTION_NOTIFICATION_TIMEZONE:Asia/Ho_Chi_Minh}
      dispatcher:
        fixed-delay-ms: ${APP_PROMOTION_DISPATCHER_DELAY_MS:15000}
        batch-size: ${APP_PROMOTION_DISPATCHER_BATCH_SIZE:100}
        max-attempts: ${APP_PROMOTION_DISPATCHER_MAX_ATTEMPTS:8}
        backoff-minutes: "${APP_PROMOTION_DISPATCHER_BACKOFF_MINUTES:1,5,15,60}"
      reminder:
        cron: ${APP_PROMOTION_REMINDER_CRON:0 */10 * * * *}
  orders:
    sla:
      vendor-confirmation:
        days: ${APP_ORDER_VENDOR_CONFIRMATION_SLA_DAYS:3}
        batch-size: ${APP_ORDER_VENDOR_CONFIRMATION_BATCH_SIZE:100}
        cron: ${APP_ORDER_VENDOR_CONFIRMATION_CRON:0 */15 * * * *}

ghn:
  api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
  token: ${GHN_API_TOKEN:}
  default-from-district-id: ${GHN_DEFAULT_FROM_DISTRICT_ID:1450}

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: ${APP_ACTUATOR_EXPOSURE:health}
  endpoint:
    health:
      show-details: never

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    root: INFO
    vn.edu.hcmuaf.fit.marketplace: INFO

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment-result}
  ipn-url: ${VNPAY_IPN_URL:}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  locale: ${VNPAY_LOCALE:vn}

momo:
  partner-code: ${MOMO_PARTNER_CODE:}
  access-key: ${MOMO_ACCESS_KEY:}
  secret-key: ${MOMO_SECRET_KEY:}
  create-url: ${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
  query-url: ${MOMO_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/query}
  return-url: ${MOMO_RETURN_URL:http://localhost:5173/payment-result}
  ipn-url: ${MOMO_IPN_URL:}
  request-type: ${MOMO_REQUEST_TYPE:captureWallet}
  lang: ${MOMO_LANG:vi}
  auto-capture: ${MOMO_AUTO_CAPTURE:true}

azure-bot:
  microsoft-app-id: ${MicrosoftAppId:}
  microsoft-app-password: ${MicrosoftAppPassword:}
  microsoft-app-tenant-id: ${MicrosoftAppTenantId:}
  microsoft-app-type: ${MicrosoftAppType:SingleTenant}
  authentication-enabled: ${AZURE_BOT_AUTH_ENABLED:false}
