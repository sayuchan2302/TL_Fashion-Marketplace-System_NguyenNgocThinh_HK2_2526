version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: marketplace-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_db_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app-network

  ai-service:
    build:
      context: ./vision-engine
      dockerfile: Dockerfile
    container_name: marketplace-ai
    restart: always
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-your_db_password}@db:5432/${DB_NAME:-marketplace}
      - HOST=0.0.0.0
      - PORT=8001
    expose:
      - "8001"
    volumes:
      - ai_models_cache:/root/.cache
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 1200M
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace-backend
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-marketplace}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-your_db_password}
      - APP_VISION_BASE_URL=http://ai-service:8001
      - APP_VISION_ENABLED=true
      - MO_MO_PARTNER_CODE=${MOMO_PARTNER_CODE}
      - MO_MO_ACCESS_KEY=${MOMO_ACCESS_KEY}
      - MO_MO_SECRET_KEY=${MOMO_SECRET_KEY}
      - VN_PAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VN_PAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - GHN_API_TOKEN=${GHN_TOKEN}
      - GHN_CLIENT_CLIENT_ID=${GHN_CLIENT_ID}
    expose:
      - "8080"
    depends_on:
      - db
      - ai-service
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketplace-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

  gateway:
    image: nginx:alpine
    container_name: marketplace-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

volumes:
  pgdata:
  ai_models_cache:

networks:
  app-network:
    driver: bridge
