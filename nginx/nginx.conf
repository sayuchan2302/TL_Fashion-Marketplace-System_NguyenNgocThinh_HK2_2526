user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Dynamic upstream definitions
    upstream frontend_server {
        server frontend:80;
    }

    upstream backend_server {
        server backend:8080;
    }

    # SERVER BLOCK FOR HTTP (PORT 80)
    server {
        listen 80;
        server_name pho-mac.bond www.pho-mac.bond api.pho-mac.bond;

        # Certbot challenge path for Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Route via HTTP until SSL is set up
        # Switch to redirect after certificates are issued
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            # Rewrite /api/foo to /foo for backend compatibility if necessary
            proxy_pass http://backend_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for realtime notifications
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

